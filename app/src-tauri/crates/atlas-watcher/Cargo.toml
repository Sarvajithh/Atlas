[package]
name = "atlas-watcher"
version.workspace = true
edition.workspace = true
publish.workspace = true

# atlas-watcher: filesystem watching, debouncing, event -> indexing job
# translation (§14, §21, §36.1). Talks to the rest of the system only through
# atlas-events, never by calling atlas-indexer directly (§46.6).

[dependencies]
atlas-types = { path = "../atlas-types" }
atlas-utils = { path = "../atlas-utils" }
atlas-events = { path = "../atlas-events" }
atlas-indexer = { path = "../atlas-indexer" }
serde_json.workspace = true

# Phase 2 (§21): real OS-level filesystem watching needs *some* concrete
# backend; `notify` is the de facto standard cross-platform crate for this
# in the Rust ecosystem (inotify/FSEvents/ReadDirectoryChangesW under one
# API), matching §5's "no additional... backend language" (it's a small,
# single-purpose watching library, not a new architectural layer).
notify = "6"
