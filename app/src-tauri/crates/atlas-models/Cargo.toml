[package]
name = "atlas-models"
version.workspace = true
edition.workspace = true
publish.workspace = true

# atlas-models: Engines Module (§14.1) -- Model Registry (§37), Model
# Scheduler (§15), Resource Manager (§38), Context Builder (§39), and Prompt
# Builder (§40). Application code (UI, IPC handlers) MUST refer to engines by
# role name only, never by underlying Ollama model name (§14.1, §27).

[dependencies]
atlas-types = { path = "../atlas-types" }
atlas-utils = { path = "../atlas-utils" }
atlas-events = { path = "../atlas-events" }
atlas-config = { path = "../atlas-config" }
atlas-indexer = { path = "../atlas-indexer" }
serde.workspace = true
serde_json.workspace = true
# HTTP client for the local Ollama instance (§5 "Inference: Ollama (local
# only)"; §31 "the app detects it at runtime"). Blocking client keeps
# core-* crates free of an async runtime dependency; app-tauri's streaming
# IPC layer runs blocking calls on a worker thread and forwards chunks as
# Tauri events (§12, §43).
ureq = { version = "2", default-features = false, features = ["json"] }
base64 = "0.22"

